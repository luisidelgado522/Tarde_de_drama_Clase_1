<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- CSS -->
    <link rel="stylesheet" href="../styles/style.css">
    <title>Tarde de Drama | Contacto</title>
</head>
<body>
    <header>
            <a href="../index.html" aria-label="Inicio" title="Inicio">
                <figure>
                    <img class="Logo" src="../assets/logos/Tarde-de-drama-logo.png" alt="Logo de Tarde de Drama, sitio de recomendaciones de mangas" title="Logo de Tarde de Drama">
                </figure>
            </a>
            <h1 class="h1-header">Tarde de Drama | Contactame</h1>
            
            <!-- Navbar de Bootstrap responsivo obligatorio -->
            <nav class="navbar navbar-expand-lg">
                <div class="container-fluid">
                    <!-- Botón del menú hamburguesa para dispositivos móviles -->
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <!-- Contenedor colapsable para los enlaces -->
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link" href="../index.html" aria-label="Inicio" title="Inicio">Inicio</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="./demografias.html" aria-label="Demografías" title="Demografías">Demografías</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="#" aria-label="Contacto" title="Contacto">Contactanos</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="./sobre-mi.html" aria-label="Acerca de mi" title="Acerca de mi">Acerca de mi</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="./recomendaciones.html" aria-label="Recomendaciones" title="Recomendaciones">Recomendaciones</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>
    <main>
        <section>
            <h2>¡Dejame tu mensaje!</h2>
            <article>
                <p>Si querés recomendarme un manga o dejarme una sugerencia, completá el siguiente formulario.</p>
            </article>
        </section>
        <form class="grid-formulario" action="">
            <div>
                <label for="name">Nombre: </label>
                <input type="text" id="name" placeholder="Escriba su nombre">
            </div>

            <div>
                <label for="email">Correo: </label>
                <input type="email" name="email" id="email" placeholder="Escriba su mail">
            </div>
            
            <div>
                <label for="cel">Celular: </label>
                <input type="tel" name="cel" id="cel" placeholder="Escriba su celular">
            </div>

            <div>
                <label for="comment">Comentarios: </label>
                <textarea name="comment" id="comment" placeholder="Deje sus comentarios"></textarea>
            </div>

            <div>
                <input type="submit" value="Enviar">
                <input type="reset" value="Comenzar de nuevo">
            </div>
        </form>
    </main>

    <footer>
        <p>Desarrollado por Luisina Delgado Lazaro</p>
        <p>&copy;<span id="year"></span>Todos los Derechos Reservados</p>

        <nav>
            <ul>
                <li>
                    <a href="https://www.instagram.com/" target="_blank" title="Instagram">
                        <img class="redes-sociales" src="../assets/logos/instagram.png" alt="Logo de Instagram" title="Logo de Instagram" aria-label="Logo de Instagram">
                    </a>
                </li>
                <li>
                    <a class="whatsapp-flotante" href="https://web.whatsapp.com/" target="_blank" title="WhatsApp">
                        <img class="redes-sociales" src="../assets/logos/whatsapp.png" alt="Logo de WhatsApp" title="Logo de WhatsApp" aria-label="Logo de WhatsApp">
                    </a>
                </li>
                <li>
                    <a href="https://www.facebook.com/?locale=es_LA" target="_blank" title="Facebook">
                        <img class="redes-sociales" src="../assets/logos/facebook.png" alt="Logo de Facebook" title="Logo de Facebook" aria-label="Logo de Facebook">
                    </a>
                </li>
            </ul>
        </nav>

    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
    <!-- BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
