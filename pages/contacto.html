                <img class="Logo" src="../assets/logos/Tarde-de-drama-logo.png" alt="Logo de Tarde de Drama, sitio de recomendaciones de mangas" title="Logo de Tarde de Drama">

    <main>
        <section>
            <h2>¡Dejame tu mensaje!</h2>
            <article>
                <p>Si querés recomendarme un manga o dejarme una sugerencia, completá el siguiente formulario.</p>
            </article>
        </section>
        <form action="">
            <div>
                <label for="name">Nombre: </label>
                <input type="text" name="name" placeholder="Escriba su nombre">
            </div>

            <div>
                <label for="email">Correo: </label>
                <input type="email" name="email" id="email" placeholder="Escriba su mail">
            </div>
            
            <div>
                <label for="cel">Celular: </label>
                <input type="tel" name="cel" id="cel" placeholder="Escriba su celular">
            </div>

            <div>
                <label for="comment">Comentarios: </label>
                <textarea name="comment" id="comment" placeholder="Deje sus comentarios"></textarea>
            </div>

            <div>
                <input type="submit" value="Enviar">
                <input type="reset" value="Comenzar de nuevo">
            </div>
        </form>
    </main>

    <footer>
        <p>Desarrollado por Luisina Delgado Lazaro</p>
        <p>&copy;<span id="year"></span>Todos los Derechos Reservados</p>
